services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: halite_postgres
    environment:
      POSTGRES_USER: halite
      POSTGRES_PASSWORD: halite_dev
      POSTGRES_DB: halite_intelligence
    ports:
      - "5432:5432"
    volumes:
      - halite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halite -d halite_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: halite_redis
    ports:
      - "6379:6379"
    volumes:
      - halite_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  halite_pgdata:
  halite_redisdata:
