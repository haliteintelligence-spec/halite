[build]
buildCommand = "pnpm install && pnpm --filter @halite/db db:generate && pnpm --filter @halite/db build && pnpm --filter @halite/dashboard build"

[deploy]
startCommand = "pnpm --filter @halite/dashboard start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
