<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halite Widget — Test</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      background: #f7f5f2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .demo-card {
      background: white;
      border-radius: 20px;
      padding: 48px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .demo-card h1 {
      font-size: 22px;
      margin: 0 0 8px;
      color: #1a1a1a;
    }
    .demo-card p {
      font-size: 14px;
      color: #888;
      margin: 0 0 28px;
    }
    .quiz-btn {
      display: inline-block;
      padding: 14px 32px;
      background: #C17A47;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .quiz-btn:hover { opacity: 0.9; }
    .note {
      margin-top: 20px;
      font-size: 11px;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="demo-card">
    <h1>Halite Widget Demo</h1>
    <p>Click below to launch the personalised skin quiz</p>
    <button class="quiz-btn" data-halite-quiz>Get My Routine →</button>
    <p class="note">Update data-api-key with your real API key</p>
  </div>

  <!--
    Production embed (replace src with your CDN URL and data-api-key with your key):

    <script
      src="https://cdn.haliteintelligence.com/widget.js"
      data-api-key="halite_live_xxxxxxxxxxxx"
      data-api-url="https://api.haliteintelligence.com"
      data-accent="#C17A47"
      defer
    ></script>

    Local test uses localhost API:
  -->
  <script
    src="./dist/halite-widget.js"
    data-api-key="YOUR_API_KEY_HERE"
    data-api-url="http://localhost:3001"
    data-accent="#C17A47"
  ></script>
</body>
</html>
