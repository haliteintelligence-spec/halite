[build]
builder = "nixpacks"
buildCommand = "pnpm install && pnpm --filter @halite/db db:generate && pnpm --filter @halite/dashboard build"

[deploy]
startCommand = "node apps/dashboard/.next/standalone/server.js"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
