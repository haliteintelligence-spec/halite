<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halite Widget — Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f5f2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .demo-card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      width: 360px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.08);
    }
    .brand {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #C17A47;
      margin: 0 0 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 6px;
      color: #1a1a1a;
    }
    .sub {
      font-size: 13px;
      color: #888;
      margin: 0 0 32px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-primary { background: #C17A47; color: white; }
    .btn-secondary { background: #f5f5f5; color: #333; }
    .divider {
      height: 1px;
      background: #f0f0f0;
      margin: 20px 0;
    }
    .note {
      font-size: 11px;
      color: #ccc;
      margin: 20px 0 0;
    }
  </style>
</head>
<body>
  <div class="demo-card">
    <p class="brand">Halite Intelligence</p>
    <h1>Demo Brand</h1>
    <p class="sub">Your AI-powered skincare companion</p>

    <div class="btn-group">
      <button class="btn btn-primary" data-halite-quiz>
        ✦ Get My Routine
      </button>
      <button class="btn btn-secondary" data-halite-checkin>
        📋 Weekly Check-in
      </button>
      <button class="btn btn-secondary" data-halite-progress>
        📊 My Progress
      </button>
      <button class="btn btn-secondary" data-halite-reorder>
        📦 Reorder Reminders
      </button>
    </div>

    <div class="divider"></div>
    <p class="note">Powered by Halite Intelligence · localhost:3001</p>
  </div>

  <script
    src="./dist/halite-widget.js"
    data-api-key="cmp04ygp20002467lyzlosuxo"
    data-api-url="http://localhost:3001"
    data-accent="#C17A47"
  ></script>
</body>
</html>
