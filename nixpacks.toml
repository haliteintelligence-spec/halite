[phases.setup]
nixPkgs = ["nodejs_20", "nodePackages_latest.pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @halite/db db:generate",
  "pnpm --filter @halite/db build",
  "pnpm --filter @halite/dashboard build",
  "cp -r apps/dashboard/.next/static apps/dashboard/.next/standalone/.next/static",
  "cp -r apps/dashboard/public apps/dashboard/.next/standalone/public"
]

[start]
cmd = "node apps/dashboard/.next/standalone/server.js"
